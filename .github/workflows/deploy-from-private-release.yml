name: Deploy from private release

on:
  repository_dispatch:
    types: [deploy-release]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag from mgwilt/mike.dev (e.g., v0.1.2)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        run: |
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            tag="${{ github.event.client_payload.tag }}"
          else
            tag="${{ inputs.release_tag }}"
          fi

          if [[ -z "$tag" ]]; then
            echo "Release tag is required."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download release artifact
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release download "$TAG" --repo mgwilt/mike.dev --pattern "site-${TAG}.tar.gz"

      - name: Replace site contents
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          temp_dir="$(mktemp -d)"
          tar -xzf "site-${TAG}.tar.gz" -C "$temp_dir"

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "CNAME" \
            -exec rm -rf {} +

          cp -R "$temp_dir"/. .
          touch .nojekyll

      - name: Commit and push
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to deploy."
            exit 0
          fi

          git commit -m "Deploy ${TAG} from mgwilt/mike.dev"
          git push origin main
